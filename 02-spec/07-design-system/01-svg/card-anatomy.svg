<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .subcard-bg { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
      .badge-bg { fill: #e0e7ff; }
      .badge-text { fill: #4338ca; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .card-desc { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; }
      .subcard-title { fill: #1e293b; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .subcard-desc { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; }
      .annotation-line { stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .annotation-text { fill: #4f46e5; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .dot { fill: #6366f1; }
    </style>
    <filter id="card-shadow" x="-10%" y="-5%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset dx="0" dy="10" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" class="bg" />

  <!-- Main Card Structure -->
  <g transform="translate(60, 50)" filter="url(#card-shadow)">
    <rect width="440" height="400" rx="16" class="card-bg" />

    <!-- Badge -->
    <rect x="24" y="24" width="130" height="24" rx="12" class="badge-bg" />
    <text x="32" y="40" class="badge-text">MODULE OVERVIEW</text>

    <!-- Title and Description -->
    <text x="24" y="80" class="card-title">Curriculum Block</text>
    <text x="24" y="105" class="card-desc">Clear modular units containing atomic learning goals</text>
    <text x="24" y="125" class="card-desc">and structured technical capabilities.</text>

    <!-- 4 Sub-blocks Grid -->
    <g transform="translate(24, 150)">
      <!-- Block 1 -->
      <rect x="0" y="0" width="190" height="95" rx="8" class="subcard-bg" />
      <circle cx="20" cy="24" r="8" fill="#6366f1" fill-opacity="0.2"/>
      <circle cx="20" cy="24" r="4" fill="#6366f1"/>
      <text x="36" y="28" class="subcard-title">01. Setup &amp; Init</text>
      <text x="16" y="55" class="subcard-desc">Configure local runtime</text>
      <text x="16" y="70" class="subcard-desc">and initialize environment</text>

      <!-- Block 2 -->
      <rect x="202" y="0" width="190" height="95" rx="8" class="subcard-bg" />
      <circle cx="222" cy="24" r="8" fill="#8b5cf6" fill-opacity="0.2"/>
      <circle cx="222" cy="24" r="4" fill="#8b5cf6"/>
      <text x="238" y="28" class="subcard-title">02. Data Contracts</text>
      <text x="218" y="55" class="subcard-desc">Define schemas, payloads,</text>
      <text x="218" y="70" class="subcard-desc">and validation pipelines</text>

      <!-- Block 3 -->
      <rect x="0" y="105" width="190" height="95" rx="8" class="subcard-bg" />
      <circle cx="20" cy="129" r="8" fill="#ec4899" fill-opacity="0.2"/>
      <circle cx="20" cy="129" r="4" fill="#ec4899"/>
      <text x="36" y="133" class="subcard-title">03. Logic &amp; State</text>
      <text x="16" y="160" class="subcard-desc">Implement finite states</text>
      <text x="16" y="175" class="subcard-desc">and business execution</text>

      <!-- Block 4 -->
      <rect x="202" y="105" width="190" height="95" rx="8" class="subcard-bg" />
      <circle cx="222" cy="129" r="8" fill="#10b981" fill-opacity="0.2"/>
      <circle cx="222" cy="129" r="4" fill="#10b981"/>
      <text x="238" y="133" class="subcard-title">04. Quality Gates</text>
      <text x="218" y="160" class="subcard-desc">Automated tests, linting,</text>
      <text x="218" y="175" class="subcard-desc">and CI/CD verification</text>
    </g>

    <!-- Footer Button -->
    <rect x="24" y="360" width="392" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="376" class="subcard-desc" fill="#6366f1" font-weight="600">Explore Complete Syllabus →</text>
  </g>

  <!-- Explanatory Callout Annotations -->
  <!-- Callout 1: Pill Badge -->
  <circle cx="150" cy="85" r="4" class="dot"/>
  <line x1="150" y1="85" x2="570" y2="85" class="annotation-line"/>
  <text x="580" y="89" class="annotation-text">1. Category Badge (Caps, pill-shape)</text>

  <!-- Callout 2: Title Typography -->
  <circle cx="200" cy="130" r="4" class="dot"/>
  <line x1="200" y1="130" x2="570" y2="140" class="annotation-line"/>
  <text x="580" y="144" class="annotation-text">2. High-Contrast Heading (Weight 700)</text>

  <!-- Callout 3: 4-Item Subgrid -->
  <circle cx="450" cy="250" r="4" class="dot"/>
  <line x1="450" y1="250" x2="570" y2="250" class="annotation-line"/>
  <text x="580" y="254" class="annotation-text">3. 2x2 Micro-Grid (Atomic components)</text>

  <!-- Callout 4: Hairline Container -->
  <circle cx="500" cy="380" r="4" class="dot"/>
  <line x1="500" y1="380" x2="570" y2="380" class="annotation-line"/>
  <text x="580" y="384" class="annotation-text">4. Hairline Border (1px crisp boundary)</text>

  <!-- Callout 5: Hover Elevation -->
  <circle cx="500" cy="430" r="4" class="dot"/>
  <line x1="500" y1="430" x2="570" y2="430" class="annotation-line"/>
  <text x="580" y="434" class="annotation-text">5. Darkish Shade (Elevates on hover)</text>
</svg>
