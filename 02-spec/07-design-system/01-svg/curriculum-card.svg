<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 850 520" width="850" height="520">
  <defs>
    <style>
      .bg { fill: #0b1329; }
      .card-dark { fill: #111c44; stroke: #1e293b; stroke-width: 1.5; }
      .pill-gold { fill: #facc15; }
      .pill-gold-text { fill: #0f172a; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 800; }
      .pill-violet { fill: #312e81; stroke: #4f46e5; stroke-width: 1; }
      .pill-violet-text { fill: #c7d2fe; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 20px; font-weight: 800; }
      .subtitle { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
      .section-box { fill: #162040; stroke: #253358; stroke-width: 1; }
      .section-title { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      .bullet-text { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; }
      .btn-cta { fill: #8b5cf6; }
      .btn-cta-text { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
    </style>
    <filter id="dark-glow" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="25" result="blur"/>
      <feOffset dx="0" dy="15" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="850" height="520" class="bg" />

  <!-- Main Card -->
  <g transform="translate(60, 40)" filter="url(#dark-glow)">
    <rect width="730" height="440" rx="18" class="card-dark" />

    <!-- Badges Row -->
    <rect x="36" y="32" width="105" height="22" rx="10" class="pill-gold" />
    <text x="47" y="47" class="pill-gold-text">BESTSELLER</text>

    <rect x="150" y="32" width="130" height="22" rx="10" class="pill-violet" />
    <text x="162" y="47" class="pill-violet-text">12 WEEKS COHORT</text>

    <rect x="290" y="32" width="115" height="22" rx="10" class="pill-violet" />
    <text x="302" y="47" class="pill-violet-text">CERTIFICATION</text>

    <!-- Header Content -->
    <text x="36" y="88" class="title">Enterprise AI Engineering &amp; LLM Architecture</text>
    <text x="36" y="112" class="subtitle">Master full-lifecycle agentic AI systems, prompt architecture, autonomous loops, and vector databases.</text>

    <!-- Grid of 3 Modules -->
    <g transform="translate(36, 140)">
      <!-- Module 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="190" rx="10" class="section-box" />
        <circle cx="24" cy="28" r="10" fill="#8b5cf6" fill-opacity="0.2" />
        <text x="21" y="32" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">01</text>
        <text x="44" y="32" class="section-title">Foundations &amp; APIs</text>
        
        <circle cx="20" cy="65" r="3" fill="#8b5cf6" />
        <text x="30" y="68" class="bullet-text">Tokenization &amp; Context</text>

        <circle cx="20" cy="95" r="3" fill="#8b5cf6" />
        <text x="30" y="98" class="bullet-text">Structured Function Calls</text>

        <circle cx="20" cy="125" r="3" fill="#8b5cf6" />
        <text x="30" y="128" class="bullet-text">Streaming &amp; Error Envelopes</text>

        <circle cx="20" cy="155" r="3" fill="#8b5cf6" />
        <text x="30" y="158" class="bullet-text">API Performance Tuning</text>
      </g>

      <!-- Module 2 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="190" rx="10" class="section-box" />
        <circle cx="24" cy="28" r="10" fill="#38bdf8" fill-opacity="0.2" />
        <text x="21" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">02</text>
        <text x="44" y="32" class="section-title">Agentic Loops &amp; Memory</text>

        <circle cx="20" cy="65" r="3" fill="#38bdf8" />
        <text x="30" y="68" class="bullet-text">Multi-Agent Subtasking</text>

        <circle cx="20" cy="95" r="3" fill="#38bdf8" />
        <text x="30" y="98" class="bullet-text">Long-Horizon Persistent Memory</text>

        <circle cx="20" cy="125" r="3" fill="#38bdf8" />
        <text x="30" y="128" class="bullet-text">Grounding &amp; Self-Correction</text>

        <circle cx="20" cy="155" r="3" fill="#38bdf8" />
        <text x="30" y="158" class="bullet-text">Subagent Thread Isolation</text>
      </g>

      <!-- Module 3 -->
      <g transform="translate(450, 0)">
        <rect width="210" height="190" rx="10" class="section-box" />
        <circle cx="24" cy="28" r="10" fill="#10b981" fill-opacity="0.2" />
        <text x="21" y="32" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">03</text>
        <text x="44" y="32" class="section-title">RAG &amp; Evaluation</text>

        <circle cx="20" cy="65" r="3" fill="#10b981" />
        <text x="30" y="68" class="bullet-text">Vector Embedding Pipelines</text>

        <circle cx="20" cy="95" r="3" fill="#10b981" />
        <text x="30" y="98" class="bullet-text">Hybrid BM25 + Dense Search</text>

        <circle cx="20" cy="125" r="3" fill="#10b981" />
        <text x="30" y="128" class="bullet-text">Automated Evaluation Gates</text>

        <circle cx="20" cy="155" r="3" fill="#10b981" />
        <text x="30" y="158" class="bullet-text">Production Monitoring &amp; Drift</text>
      </g>
    </g>

    <!-- Card Action Footer -->
    <g transform="translate(36, 360)">
      <rect width="180" height="42" rx="8" class="btn-cta" />
      <text x="38" y="26" class="btn-cta-text">Enroll in Program →</text>
      <text x="210" y="26" class="subtitle" font-size="12">Next Cohort Starts Monday • Limited Seats</text>
    </g>
  </g>
</svg>
