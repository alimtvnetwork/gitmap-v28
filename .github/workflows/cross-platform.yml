name: Cross-Platform Build

# Verifies that `go build` and `go test` succeed on Linux, macOS, and
# Windows. Catches build-tag leaks (e.g. `//go:build windows` symbols
# referenced from untagged files) that pass on the developer's host
# OS but break the cross-compile matrix.
#
# Lessons learned: see .ai-memory/memory/issues/ — startup/win*.go leaked
# `addWindowsRegistry` into the Linux build because the stub file used
# the wrong build tag. A matrix CI job would have caught it pre-merge.

on:
  push:
    branches:
      - '**'
      - '!release/**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / go build + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6

      - name: Optimize Windows Runner I/O
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -ExclusionPath "${{ github.workspace }}", "C:\hostedtoolcache", "$env:USERPROFILE\go", "$env:LOCALAPPDATA\go-build", "$env:TEMP", "$env:TMP"

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Cache Go build cache (GOCACHE)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: go-build-${{ runner.os }}-xplat-${{ hashFiles('cli/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-xplat-${{ hashFiles('cli/go.sum') }}-
            go-build-${{ runner.os }}-xplat-

      - name: go build ./...
        run: go build -p 4 ./...

      # Verify test compilation across every package without executing tests.
      # This completes in ~15-20s and catches 100% of build-tag leaks and OS-specific
      # compilation issues across Linux, macOS, and Windows.
      - name: Verify test compilation (build-tag check)
        run: go test -run=^$ -p 4 ./...

      # Execute fast unit tests using Go's test cache.
      # Unchanged packages pass instantly via (cached), while heavy integration
      # suites are handled by the partitioned CI test matrix.
      - name: go test ./... (cached)
        run: go test -short -p 4 ./...

      # Defense in depth: even on a single host OS, verify the other two
      # GOOS targets still cross-compile. Catches build-tag leaks that
      # the host-native job above cannot see (e.g. a Linux-only file
      # referencing a stub that only exists on darwin).
      - name: cross-compile sibling GOOS (vet only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin  GOARCH=amd64 go vet ./...
