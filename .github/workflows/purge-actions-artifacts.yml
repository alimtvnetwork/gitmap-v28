name: Purge GitHub Actions Artifacts (Zero Storage)

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  purge-artifacts:
    name: Purge All Actions Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Purge Stored Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 03-ai-scripts/34-purge-github-actions-artifacts.py --repo "${{ github.repository }}"
