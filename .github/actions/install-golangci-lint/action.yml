name: Install golangci-lint
description: |
  Installs the project-pinned golangci-lint binary into GOPATH/bin and adds
  it to PATH. Pinned to v2.13.2 per `mem://core` policy ("golangci-lint
  pinned to v2.13.2"). Bump in lockstep across all callers.
runs:
  using: composite
  steps:
    - name: Install golangci-lint v2.13.2
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
          | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
