name: Install golangci-lint
description: |
  Installs the project-pinned golangci-lint binary into GOPATH/bin and adds
  it to PATH. Pinned to v1.64.8 per `mem://core` policy ("golangci-lint
  pinned to v1.64.8"). Built with current Go toolchain to ensure compatibility
  with newer Go versions (e.g. Go 1.25+).
runs:
  using: composite
  steps:
    - name: Install golangci-lint v1.64.8
      shell: bash
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
