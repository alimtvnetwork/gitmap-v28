run:
  timeout: 5m
  modules-download-mode: readonly
  go: '1.24'

linters:
  disable-all: true
  enable:
    - staticcheck
    - unused
    - misspell
    - nolintlint
    - bodyclose
    - errname
    - copyloopvar
    - usestdlibvars

linters-settings:
  misspell:
    locale: US

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
